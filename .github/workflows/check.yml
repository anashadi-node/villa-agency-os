name: check

# Gerbang yang sama dengan `make check` di mesin lokal. Tujuannya bukan "CI hijau"
# sebagai hiasan, melainkan memastikan klaim di README dan dokumen A-Z (jumlah tes,
# secret-scan, paritas twin PostgreSQL) diuji ulang oleh mesin yang tidak menyimpan
# keadaan lokal: tanpa DB live, tanpa venv, tanpa berkas token, tanpa data/villa.db.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pre-deploy gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = interpreter produksi (/usr/bin/python3, Ubuntu 24.04). 3.11 dan 3.13 menjaga
        # klaim "stdlib-only" tetap benar di kedua sisinya (audit 2026-11-13, S4).
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Riwayat penuh, bukan clone dangkal: gerbang T2.8 memeriksa bahwa setiap commit yang
      # dikutip dokumen benar-benar ada di riwayat (tests/test_sprint_doc_claims.py). Di clone
      # `fetch-depth: 1` objeknya tidak ada, dan "tidak terlihat" bukan "tidak ada".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Versi action dipin ke major terbaru (v7) karena v4/v5 masih target Node.js 20;
      # runner memaksanya jalan di Node 24 dan mencetak peringatan deprecation tiap run.
      # `src/` hanya memakai stdlib. Yang dipasang di sini adalah perkakas gerbang:
      # pytest untuk suite, pyflakes untuk `make lint`, markdown untuk
      # `scripts/build_deliverables.py` (dua tesnya merender dokumen sungguhan).
      # Sumber versi = requirements-dev.txt. Jangan menulis nama paket di baris ini:
      # `pip install --upgrade pytest pyflakes markdown` pernah membuat CI memakai versi
      # yang tidak pernah tercatat (markdown 3.11.3) sementara manifes memaku 3.5.2,
      # sehingga Dependabot membuka PR untuk versi yang sudah usang (PR #11).
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # `set -o pipefail` wajib: tanpa itu status `make check` tertelan `tee`, dan run
      # yang gagal berakhir "success". Diukur pada run pertama workflow ini: gerbang
      # merah (6 tes gagal) tetapi job dilaporkan sukses.
      - name: Run make check
        env:
          PYTHON: python
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log

      # Bukti alur penuh di DB kosong: 17 langkah dari tenant sampai penutupan §30,
      # termasuk urutan bayar → bukti blok → CONFIRMED (ADR-0069). Laporan JSON ikut diunggah.
      - name: Go-live smoke
        run: |
          set -o pipefail
          python scripts/go_live_smoke.py --db "$RUNNER_TEMP/smoke.db" --report smoke.report.json 2>&1 | tee -a check.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-log-python-${{ matrix.python }}
          path: |
            check.log
            smoke.report.json
          if-no-files-found: ignore

  # Paritas twin PostgreSQL di server sungguhan — job terpisah karena service container
  # tidak perlu memperlambat tiga job matriks. Alasannya bukan kelengkapan: tanpa server,
  # empat tes live-PostgreSQL di tests/test_schema.py hanya SKIP, sehingga gerbang hijau
  # padahal 001_initial.pg.sql belum pernah diterapkan ke PostgreSQL mana pun. Diukur pada
  # checkout bersih 2026-11-14: tanpa server 71 passed + 4 skipped; dengan server 75 passed,
  # 0 skipped. `VILLA_PG_REQUIRED=1` menutup pintu belakangnya: service hilang → job MERAH,
  # bukan hijau-dengan-skip. Penjaganya: tests/test_gate_dependencies.py.
  postgres-parity:
    name: twin PostgreSQL di server sungguhan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # PACK-04A: VILLA_PG_DSN tidak lagi ditulis di sini. Langkah "Provision a
      # least-privilege test role" membuatnya (role NOSUPERUSER, sandi acak sekali pakai)
      # dan mengekspornya bersama VILLA_PG_DISPOSABLE_RUN lewat GITHUB_ENV. Tes
      # menolak berjalan tanpa token run itu: tests/test_pg_overlap_concurrency.py.
      VILLA_PG_REQUIRED: "1"
    steps:
      # Riwayat penuh, bukan clone dangkal: gerbang T2.8 memeriksa bahwa setiap commit yang
      # dikutip dokumen benar-benar ada di riwayat (tests/test_sprint_doc_claims.py). Di clone
      # `fetch-depth: 1` objeknya tidak ada, dan "tidak terlihat" bukan "tidak ada".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Sumber versi tetap satu: requirements-dev.txt (memuat psycopg untuk tes ini).
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Service container ini dibuat khusus untuk run ini dan dibuang sesudahnya. Superuser
      # `postgres` hanya dipakai di sini untuk membuat role tes; tes sendiri berjalan
      # sebagai role tanpa hak superuser dan hanya boleh membuat/menjatuhkan database
      # buatannya sendiri (villa_t_<hex>).
      - name: Provision a least-privilege test role
        env:
          PGPASSWORD: postgres
        run: |
          ROLE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${ROLE_PASSWORD}"
          psql "host=localhost port=5432 user=postgres dbname=postgres" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE villa_ci LOGIN NOSUPERUSER CREATEDB NOCREATEROLE PASSWORD '${ROLE_PASSWORD}'"
          echo "VILLA_PG_DSN=postgresql://villa_ci:${ROLE_PASSWORD}@localhost:5432/postgres" >> "$GITHUB_ENV"
          echo "VILLA_PG_DISPOSABLE_RUN=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # Empat berkas di server sungguhan: paritas katalog (skema), gerbang G1 (kunci idempoten
      # + bukti append-only), bukti konkurensi constraint (FR-904, lapisan DB saja), dan bukti
      # kepemilikan slot lintas tabel (021: HOLD x BOOKING pada unit yang sama).
      # `-rs` mencetak setiap SKIP; langkah berikutnya menolak SKIP di berkas wajib.
      - name: Apply the twin, compare catalogues, run gate G1 and the concurrency proof
        run: |
          set -o pipefail
          python -m pytest tests/test_schema.py tests/test_workforce_gate_g1.py tests/test_pg_overlap_concurrency.py tests/test_pg_migrations.py tests/test_pg_cross_table_occupancy.py -rs 2>&1 | tee pg-parity.log

      # Skip diam-diam = bukti palsu. Dengan VILLA_PG_REQUIRED=1 tidak satu tes PG pun boleh SKIP.
      - name: Refuse skipped PostgreSQL tests
        run: |
          if grep -Eq "[0-9]+ skipped" pg-parity.log; then
            echo "postgres-parity reported skipped tests" >&2
            exit 1
          fi

      - name: Upload parity log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-parity-log
          path: pg-parity.log
          if-no-files-found: ignore

