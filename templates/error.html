<section data-page="error" data-status="{{ status }}" data-code="{{ error_code }}">
  <h2>Permintaan ditolak</h2>
  <p class="empty banner" data-error="1">{{ status }} — {{ error_code }}: {{ error_message }}</p>
  <p class="muted">Rincian teknis: <code>{{ error_details }}</code></p>
  <p class="muted">Kembali ke <a href="/" data-nav="command_center">Command Center</a>.</p>
</section>
