<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="Private villas in Bali and Yogyakarta with local concierge, verified availability, and direct booking confidence.">
{{head_extra}}
<style>
:root{--sand:#f8efe0;--paper:#fffaf2;--ink:#20241f;--teak:#173f33;--leaf:#2d6a50;--gold:#c8943f;--clay:#a95d38;--line:#e5d9c3}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--paper);line-height:1.6}
header.site{background:var(--teak);color:var(--paper);padding:.9rem 1.4rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
header.site .brand{font-size:1.25rem;letter-spacing:.02em;color:#fff;text-decoration:none}
header.site nav a{color:#e9dfc8;text-decoration:none;margin-right:1rem;font-size:.95rem}
header.site nav a:hover{color:var(--gold)}
main{max-width:960px;margin:0 auto;padding:1.5rem 1.4rem 3rem}
h1{font-size:2rem;color:var(--teak);margin:.4rem 0 1rem;line-height:1.25}
h2{color:var(--teak);margin-top:2rem}
a{color:var(--leaf)}
.lede{font-size:1.08rem;max-width:46rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;margin-top:1.2rem}
.card{border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;background:var(--sand)}
.card h3{margin:.2rem 0 .4rem;font-size:1.12rem}
.card h3 a{color:var(--teak);text-decoration:none}
.card h3 a:hover{color:var(--leaf)}
.card-region{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--clay)}
.card-facts{font-size:.92rem;color:#4a4a42}
.card-link{font-size:.92rem;text-decoration:none}
.cta{display:inline-block;background:var(--leaf);color:#fff;padding:.65rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:bold}
.cta:hover{background:var(--teak)}
.cta.gold{background:var(--gold)}
.badges{display:flex;flex-wrap:wrap;gap:.8rem;margin:1.2rem 0 0;padding:0;list-style:none}
.badges li{background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;font-size:.88rem}
table{border-collapse:collapse;width:100%;margin-top:1rem}
th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;font-size:.95rem}
th{background:var(--sand);color:var(--teak)}
form{max-width:34rem}
label{display:block;margin:1rem 0 .3rem;font-weight:bold}
input[type=text],input[type=email],textarea{width:100%;padding:.6rem;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:1rem;background:#fff}
textarea{min-height:8rem}
button{margin-top:1.2rem;background:var(--leaf);color:#fff;border:0;border-radius:8px;padding:.7rem 1.4rem;font-size:1rem;cursor:pointer;font-family:inherit}
button:hover{background:var(--teak)}
.hp{position:absolute;left:-9999px;top:-9999px}
.note{background:var(--sand);border-left:4px solid var(--gold);padding:.7rem 1rem;border-radius:0 8px 8px 0;font-size:.95rem}
footer.site{border-top:1px solid var(--line);margin-top:2.5rem;padding:1.2rem 1.4rem;font-size:.85rem;color:#6b6455;max-width:960px;margin-left:auto;margin-right:auto}
.empty{color:#6b6455}
.dest-links{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}
.dest-links a{background:var(--sand);border:1px solid var(--line);border-radius:8px;padding:.8rem 1.2rem;text-decoration:none;color:var(--teak)}
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="/">Villa Agency</a>
  <nav>
    <a href="/villas">Villas</a>
    <a href="/destinations/bali">Bali</a>
    <a href="/destinations/yogyakarta">Yogyakarta</a>
    <a href="/inquiry">Plan my stay</a>
  </nav>
</header>
<main>
{{body}}
</main>
<footer class="site">
  <p>Villa Agency — private villas in Bali and Yogyakarta. Every inquiry is answered by our local team; availability is verified with the villa owner before any quote is confirmed.</p>
</footer>
</body>
</html>
